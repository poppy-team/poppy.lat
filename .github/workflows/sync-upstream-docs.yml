# Keeps the imported documentation in step with the project repositories.
#
# The site publishes pinned copies, so it never changes on its own. This
# workflow advances the pins: it moves each project's revision to the tip of
# the upstream default branch, regenerates every derived file, verifies the
# result and opens (or updates) one pull request. Merging that pull request is
# what publishes the new content, which keeps a person in the loop.
name: Sync upstream docs

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  # A project repository can notify the site as soon as its docs change:
  #   gh api repos/poppy-team/poppy.lat/dispatches -f event_type=upstream-docs-updated
  repository_dispatch:
    types: [upstream-docs-updated]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream-docs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Clone the project repositories
        run: |
          mkdir -p "$RUNNER_TEMP/upstream"
          for repo in ori-lang aipo-lang oride prumo; do
            git clone --quiet --depth 1 "https://github.com/poppy-team/$repo" "$RUNNER_TEMP/upstream/$repo"
          done

      - name: Advance the pins
        run: node --experimental-strip-types scripts/sync-upstream.ts "$RUNNER_TEMP/upstream"

      - name: Nothing to sync
        id: changed
        run: |
          if git diff --quiet -- packages/project-data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate the imported content
        if: steps.changed.outputs.changed == 'true'
        run: |
          pnpm install --frozen-lockfile
          node --experimental-strip-types scripts/import-docs.ts "$RUNNER_TEMP/upstream"
          node --experimental-strip-types scripts/generate-routes.ts
          node --experimental-strip-types scripts/generate-manifest.ts

      - name: Verify
        if: steps.changed.outputs.changed == 'true'
        run: |
          pnpm check
          pnpm build
          pnpm test

      - name: Open or update the sync pull request
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=automation/sync-upstream-docs
          git config user.name "poppy-sync[bot]"
          git config user.email "poppy-sync@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A
          git commit -m "chore(docs): sync the imported documentation with upstream"
          git push --force-with-lease origin "$branch"

          body="Advances each project's pinned revision to the tip of its upstream default branch and regenerates the imported pages, the source manifest and the route stubs. Generated by the Sync upstream docs workflow; \`pnpm check\`, \`pnpm build\` and \`pnpm test\` passed on this exact tree."

          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --head "$branch" --base main \
              --title "Sync the imported documentation with upstream" \
              --body "$body"
          else
            gh pr comment "$branch" --body "Refreshed with the latest upstream revisions."
          fi
