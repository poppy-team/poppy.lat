<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#33483f" />
    <title>Sem conexão | Poppy Team</title>
    <style>
      :root { color-scheme: light dark; --paper: #f1eddf; --ink: #262a25; --soft: #4b4e46; --leaf: #33483f; --card: #f8f5eb; }
      @media (prefers-color-scheme: dark) { :root { --paper: #1b1e1b; --ink: #ece8da; --soft: #c2bfb2; --leaf: #b9d2bf; --card: #232723; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.25rem; background: var(--paper); color: var(--ink); font: 1.0625rem/1.6 system-ui, sans-serif; }
      main { max-width: 34rem; padding: 2rem; border: 1px solid color-mix(in srgb, var(--ink) 18%, transparent); border-radius: 1rem; background: var(--card); }
      h1 { margin: 0 0 .5rem; font-size: 1.5rem; line-height: 1.25; }
      p { margin: 0 0 1rem; color: var(--soft); }
      button { min-height: 2.75rem; padding: 0 1.25rem; border: 0; border-radius: .5rem; background: var(--leaf); color: var(--paper); font: inherit; font-weight: 700; cursor: pointer; }
      button:focus-visible { outline: 3px solid currentColor; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main id="main-content">
      <h1>Você está sem conexão</h1>
      <p>Esta página ainda não foi aberta neste aparelho, então não dá para mostrá-la agora. As lições que você já leu continuam disponíveis: volte e abra uma delas.</p>
      <p>Quando a internet voltar, é só tentar de novo.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
